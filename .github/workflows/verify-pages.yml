name: Verify public Medlivo build
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Compare public HTML with the source manifest
        run: |
          mkdir -p live-verification
          python - <<'PY'
          import pathlib,json,hashlib,urllib.request,time
          m=json.loads(pathlib.Path('BUILD.json').read_text());out=pathlib.Path('live-verification');results=[]
          for name,expected in m['pages'].items():
              row={'page':name,'expected_sha256':expected['sha256']}
              url='https://pks-alt.github.io/Medlivo-Website/'+('' if name=='index.html' else name)
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Medlivo-Public-Verification'})
                      with urllib.request.urlopen(req,timeout=40) as r:data=r.read();row['status']=r.status
                      actual=hashlib.sha256(data).hexdigest();row.update(actual_sha256=actual,matched=actual==expected['sha256'])
                      if row['matched']:break
                  except Exception as e:row['error']=str(e)
                  time.sleep(10)
              results.append(row)
          (out/'public-hash-verification.json').write_text(json.dumps({'build_id':m['build_id'],'pages':results},indent=2))
          print(json.dumps(results,indent=2))
          assert all(x.get('matched') for x in results),'Public files do not match. Do not report completion.'
          PY
      - name: Install browser driver
        run: python -m pip install playwright
      - name: Check actual public pages on desktop and mobile
        run: |
          python - <<'PY'
          import pathlib,json,shutil,subprocess
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('live-verification');results=[];failures=[]
          with sync_playwright() as p:
              exe=shutil.which('google-chrome') or shutil.which('chromium')
              if not exe:subprocess.run(['python','-m','playwright','install','chromium'],check=True)
              browser=p.chromium.launch(headless=True,**({'executable_path':exe} if exe else {}),args=['--no-sandbox'])
              for width in [1440,390]:
                  for name in ['index.html','workforce-solutions.html','nursing-allied.html','rehabilitation.html','request-staff.html']:
                      page=browser.new_page(viewport={'width':width,'height':1000 if width==1440 else 844},device_scale_factor=1)
                      errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                      url='https://pks-alt.github.io/Medlivo-Website/'+('' if name=='index.html' else name)
                      response=page.goto(url,wait_until='networkidle',timeout=60000)
                      row={'page':name,'url':url,'width':width,'status':response.status,'overflow':page.evaluate('document.documentElement.scrollWidth > innerWidth'),'headings':page.locator('main h1,main h2').all_text_contents(),'errors':errors,'broken_images':page.locator('img').evaluate_all('(es)=>es.filter(e=>!e.complete||e.naturalWidth===0).map(e=>e.getAttribute("src"))')}
                      if name=='index.html':
                          row['home_v2']=page.locator('.workforce-v2').count()==1 and page.locator('.why-v2').count()==1
                          row['ready_when_you_are']=page.get_by_text('Ready When You Are',exact=True).count()
                          assert row['home_v2'] and row['ready_when_you_are']==0
                          if width==1440:page.screenshot(path=str(out/'home-live-browser.png'))
                      if name=='nursing-allied.html':assert page.locator('#open-positions').count()==1
                      if name=='rehabilitation.html':
                          row['care_settings']=page.locator('.care-settings .setting-card h3').all_text_contents()
                          assert len(row['care_settings'])==4
                          if width==1440:page.locator('.care-settings').screenshot(path=str(out/'rehab-four-settings-live.png'))
                      if name=='request-staff.html':assert page.locator('#staffingRequestForm').count()==1
                      page.screenshot(path=str(out/(name.replace('.html','')+'-live-'+str(width)+'.png')),full_page=True)
                      if row['status']!=200 or row['overflow'] or row['errors'] or row['broken_images']:failures.append(row)
                      results.append(row);page.close()
              browser.close()
          (out/'public-browser-verification.json').write_text(json.dumps({'results':results,'failures':failures},indent=2))
          print(json.dumps({'results':results,'failures':failures},indent=2))
          assert not failures,'Browser verification found defects'
          PY
      - name: Save public-site evidence on GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-verification
          path: live-verification/
          retention-days: 14
