name: Nursing and Allied isolated spacing review
on:
  push:
    branches: ["qa/nursing-allied-spacing-20260928"]
    paths: [".github/workflows/nursing-allied-spacing-review.yml"]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package the current preview and its approved assets
        run: |
          git fetch --depth=1 origin main
          mkdir -p review-source
          git archive origin/main assets | tar -x -C review-source
          git show origin/main:nursing-allied-preview/index.html > review-source/preview-original.html
          git show origin/main:nursing-allied.html > review-source/nursing-allied.html
          git show origin/main:index.html > review-source/index.html
          git show HEAD:nursing-allied.html > review-source/branch-original.html
          git rev-parse origin/main > review-source/SOURCE_COMMIT.txt
          git rev-parse origin/main:nursing-allied-preview/index.html > review-source/PREVIEW_BLOB.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nursing-allied-current-preview-source
          path: review-source/
          retention-days: 7
