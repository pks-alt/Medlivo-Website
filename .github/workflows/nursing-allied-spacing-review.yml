name: Nursing and Allied isolated spacing review
on:
  push:
    branches: ["qa/nursing-allied-spacing-20260928"]
    paths: [".github/workflows/nursing-allied-spacing-review.yml"]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the current preview without changing the approved homepage
        run: |
          git fetch --depth=1 origin main
          mkdir -p .review
          git show origin/main:nursing-allied-preview/index.html > .review/preview-original.html
      - name: Install source-processing dependencies
        run: python -m pip install beautifulsoup4 Pillow
      - name: Apply reviewed changes and preserve every role and opportunities link
        run: python scripts/refine-nursing-allied.py
      - name: Commit only the candidate page, its preview, and its approved photo
        run: |
          test "$GITHUB_REF_NAME" = "qa/nursing-allied-spacing-20260928"
          git config user.name "Medlivo Site Review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nursing-allied.html nursing-allied-preview/index.html assets/images/nursing-allied-approved.webp
          if ! git diff --cached --quiet; then
            git commit -m "Apply reviewed Nursing and Allied spacing and content refinements"
            git push origin HEAD:qa/nursing-allied-spacing-20260928
          fi
          cp .review/manifest.json review-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: nursing-allied-reviewed-candidate
          path: |
            nursing-allied.html
            nursing-allied-preview/index.html
            assets/images/nursing-allied-approved.webp
            review-manifest.json
          retention-days: 7
