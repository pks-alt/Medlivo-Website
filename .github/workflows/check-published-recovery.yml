name: Check published recovery now
on:
  push:
    branches: ["recovery/approved-20260927"]
    paths: [".github/workflows/check-published-recovery.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec962a7bb7850cd6bfe7805664ca15a4261b508e
      - name: Install YAML reader
        run: python -m pip install PyYAML
      - name: Run the exact merged public verification scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          workflow=yaml.safe_load(Path('.github/workflows/verify-pages.yml').read_text())
          for step in workflow['jobs']['verify']['steps']:
              if 'run' in step:
                  print('CHECK:',step['name'],flush=True)
                  subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
          PY
      - name: Save public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-verification
          path: live-verification/
          retention-days: 14
