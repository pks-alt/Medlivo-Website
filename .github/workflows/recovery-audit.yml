name: Recovery audit (read only)
on:
  push:
    branches: ["recovery/approved-20260927"]
    paths: [".github/workflows/recovery-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare live pages and saved source versions
        run: |
          mkdir -p recovery-audit
          python - <<'PY'
          import pathlib, urllib.request, json, hashlib, re, subprocess, os
          out=pathlib.Path('recovery-audit')
          base='https://pks-alt.github.io/Medlivo-Website/'
          pages=['index.html','workforce-solutions.html','nursing-allied.html','rehabilitation.html','search-jobs.html','request-staff.html']
          def digest(b): return hashlib.sha256(b).hexdigest()
          def markers(text):
              return {'ready_when_you_are': 'Ready When You Are' in text, 'care_setting_rows': len(re.findall(r'class="setting-card"',text)), 'homepage_intake_form': 'id="staffingRequestForm"' in text, 'open_positions': 'id="open-positions"' in text, 'headings': [re.sub('<[^>]+>','',s).strip() for s in re.findall(r'<h[12][^>]*>(.*?)</h[12]>',text,re.S)]}
          report=[]
          for name in pages:
              root=pathlib.Path(name).read_bytes() if pathlib.Path(name).exists() else b''
              v2=pathlib.Path('v2',name).read_bytes()
              compiled=v2.replace(b'href="v2/',b'href="').replace(b"href='v2/",b"href='")
              row={'page':name,'root':markers(root.decode()),'v2':markers(compiled.decode()),'root_sha256':digest(root),'v2_sha256':digest(compiled)}
              try:
                  url=base+('' if name=='index.html' else name)
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Medlivo-Recovery-Audit'})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      data=response.read(); row.update(status=response.status,final_url=response.url,headers=dict(response.headers))
                  (out/('live-'+name)).write_bytes(data)
                  row.update(live=markers(data.decode()),live_sha256=digest(data),matches_root=data==root,matches_v2=data==compiled)
              except Exception as exc: row['fetch_error']=str(exc)
              report.append(row)
          (out/'live-source-comparison.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          log=subprocess.check_output(['git','log','--all','--since=2026-09-28T02:00:00Z','--until=2026-09-28T05:05:00Z','--date=iso-strict','--pretty=format:%H | %ad | %s','--name-only'],text=True)
          (out/'evening-commit-history.txt').write_text(log)
          PY
      - name: Install browser driver
        run: python -m pip install playwright
      - name: Capture the actual public pages
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import pathlib,json,shutil
          out=pathlib.Path('recovery-audit'); results=[]
          with sync_playwright() as p:
              executable=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
              if not executable:
                  import subprocess
                  subprocess.run(['python','-m','playwright','install','chromium'],check=True)
              browser=p.chromium.launch(headless=True,**({'executable_path':executable} if executable else {}),args=['--no-sandbox'])
              for name in ['index.html','workforce-solutions.html','nursing-allied.html','rehabilitation.html']:
                  page=browser.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
                  url='https://pks-alt.github.io/Medlivo-Website/'+('' if name=='index.html' else name)
                  row={'page':name,'url':url}; errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  try:
                      response=page.goto(url,wait_until='networkidle',timeout=60000)
                      page.screenshot(path=str(out/(name.replace('.html','')+'-live-desktop.png')),full_page=True)
                      row.update(status=response.status if response else None,headings=page.locator('main h1,main h2').all_text_contents(),setting_rows=page.locator('.care-settings .setting-card').count(),has_intake_form=page.locator('#staffingRequestForm').count(),ready_section=page.get_by_text('Ready When You Are',exact=True).count(),overflow=page.evaluate('document.documentElement.scrollWidth > innerWidth'),errors=errors)
                      if name=='rehabilitation.html':page.locator('.care-settings').screenshot(path=str(out/'rehab-care-settings-live.png'))
                  except Exception as e:row['browser_error']=str(e)
                  results.append(row);page.close()
              browser.close()
          (out/'browser-results.json').write_text(json.dumps(results,indent=2));print(json.dumps(results,indent=2))
          PY
      - name: Save evidence in GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit
          path: recovery-audit/
          retention-days: 14
